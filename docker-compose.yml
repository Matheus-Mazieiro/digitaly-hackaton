services:
  db:
    image: postgres:16-alpine
    container_name: digitaly-db
    environment:
      POSTGRES_USER: digitaly
      POSTGRES_PASSWORD: digitaly
      POSTGRES_DB: digitaly
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # scripts .sql rodam automaticamente na PRIMEIRA inicialização (ordem alfabética)
      - ./back/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U digitaly -d digitaly"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
